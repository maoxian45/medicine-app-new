<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>老人模式 页面1 首页</title>
<style>
:root{
  --screen:#f7fbf9;--primary:#16a085;--primary-dark:#0f766e;--soft:#e5f7f2;
  --text:#17212b;--muted:#667085;--line:#e5e7eb;--card:#fff;
  --orange:#f59e0b;--red:#ef4444;--blue:#3b82f6;--green:#22c55e;
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:18px;background:linear-gradient(135deg,#edf8f3,#eaf4fb);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);
}
.phone{
  width:330px;height:714px;background:#0b1220;border-radius:42px;padding:10px;
  box-shadow:0 18px 45px rgba(15,23,42,.20);position:relative;
}
.phone:before{content:"";position:absolute;top:12px;left:50%;transform:translateX(-50%);width:92px;height:26px;background:#050505;border-radius:0 0 16px 16px;z-index:9}
.screen{height:100%;border-radius:34px;background:var(--screen);overflow:hidden;position:relative}
.status{height:40px;padding:11px 20px 0;display:flex;justify-content:space-between;font-size:11px;font-weight:800;position:relative;z-index:4}
.icons{display:flex;gap:4px;align-items:center}
.battery{width:20px;height:9px;border:1.5px solid #0f172a;border-radius:3px;position:relative}
.battery:after{content:"";position:absolute;left:2px;top:2px;width:12px;height:3px;background:#0f172a;border-radius:1px}

/* 老人模式 适老化设计 */
.content{height:calc(100% - 40px - 58px);overflow-y:auto;padding:0 16px 90px;scrollbar-width:none}
.content::-webkit-scrollbar{display:none}
.nav{position:absolute;left:10px;right:10px;bottom:10px;height:60px;background:rgba(255,255,255,.96);border:1px solid #e5e7eb;border-radius:24px;display:grid;grid-template-columns:repeat(3,1fr);padding:6px;box-shadow:0 -10px 24px rgba(15,23,42,.07)}
.nav div{border-radius:17px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:#94a3b8;gap:2px}
.nav span{font-size:22px;line-height:1}
.nav .active{background:var(--soft);color:var(--primary)}

.header{padding:6px 16px 10px;display:flex;align-items:center;justify-content:space-between}
.header-left small{display:block;color:var(--muted);font-size:12px;margin-bottom:2px}
.header-left h1{margin:0;font-size:22px;font-weight:900;letter-spacing:-.02em}
.elder-badge{background:var(--soft);color:var(--primary-dark);border-radius:12px;padding:6px 10px;font-size:11px;font-weight:900;display:flex;align-items:center;gap:4px}

.hero{border-radius:22px;background:linear-gradient(135deg,#13b89a,#0f766e);color:#fff;padding:15px 16px;margin-bottom:13px;box-shadow:0 10px 24px rgba(15,118,110,.20);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-30px;top:-28px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.10)}
.hero h2{margin:0 0 5px;font-size:18px;position:relative;z-index:1}
.hero p{margin:0;color:rgba(255,255,255,.88);font-size:12.5px;line-height:1.55;position:relative;z-index:1}
.hero-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:11px;position:relative;z-index:1}
.hm{background:rgba(255,255,255,.16);border-radius:13px;padding:7px 4px;text-align:center}
.hm b{display:block;font-size:18px;font-weight:900}
.hm span{font-size:10.5px;color:rgba(255,255,255,.82)}

.group-label{display:flex;align-items:center;gap:7px;margin:13px 2px 8px}
.group-label .gi{font-size:22px;line-height:1}
.group-label b{font-size:16px;font-weight:900}
.group-label .gstatus{margin-left:auto;font-size:11px;font-weight:900;padding:4px 9px;border-radius:999px}
.gstatus.done{background:#dcfce7;color:#15803d}
.gstatus.pending{background:#fff7ed;color:#c2410c}

.med-card{background:#fff;border:1px solid #e8eef2;border-radius:22px;padding:13px;margin-bottom:10px;box-shadow:0 6px 18px rgba(15,23,42,.05)}
.med-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.med-icon{width:48px;height:48px;border-radius:16px;background:var(--soft);display:grid;place-items:center;font-size:26px;flex-shrink:0}
.med-info .med-name{font-size:18px;font-weight:900;margin:0 0 3px;line-height:1.2}
.med-info .med-dose{font-size:13px;color:var(--muted);line-height:1.4}
.med-actions{display:grid;grid-template-columns:5fr 3fr;gap:9px}
.btn-done{border:0;background:var(--primary);color:#fff;height:54px;border-radius:16px;font-weight:900;font-size:17px;box-shadow:0 8px 20px rgba(22,160,133,.22);cursor:pointer}
.btn-done.done-state{background:#22c55e;box-shadow:0 8px 20px rgba(34,197,94,.22)}
.btn-voice{border:1.5px solid rgba(22,160,133,.3);background:var(--soft);color:var(--primary-dark);height:54px;border-radius:16px;font-weight:900;font-size:15px;cursor:pointer}
</style>
</head>
<body>
<div class="phone">
  <div class="screen">
    <div class="status"><span>9:41</span><div class="icons"><span>●●●</span><span>5G</span><span class="battery"></span></div></div>

    <header class="header">
      <div class="header-left">
        <small>早上好，爷爷</small>
        <h1>今天要吃的药</h1>
      </div>
      <div class="elder-badge">👴 老人模式</div>
    </header>

    <main class="content">
      <section class="hero">
        <h2>今天共 3 次用药</h2>
        <p>早上已完成，中午和晚上各 1 次待服。</p>
        <div class="hero-metrics">
          <div class="hm"><b>1</b><span>已完成</span></div>
          <div class="hm"><b>2</b><span>待服药</span></div>
          <div class="hm"><b>0</b><span>已漏服</span></div>
        </div>
      </section>

      <!-- 早上 -->
      <div class="group-label">
        <span class="gi">🌅</span>
        <b>早 上</b>
        <span class="gstatus done">已完成</span>
      </div>
      <div class="med-card">
        <div class="med-top">
          <div class="med-icon">❤️</div>
          <div class="med-info">
            <div class="med-name">降 压 药</div>
            <div class="med-dose">早餐后 · 1 片 · 温水送服</div>
          </div>
        </div>
        <div class="med-actions">
          <button class="btn-done done-state">✓ 已确认吃药</button>
          <button class="btn-voice">🔊 听一遍</button>
        </div>
      </div>

      <!-- 中午 -->
      <div class="group-label">
        <span class="gi">☀️</span>
        <b>中 午</b>
        <span class="gstatus pending">待服药</span>
      </div>
      <div class="med-card">
        <div class="med-top">
          <div class="med-icon">💊</div>
          <div class="med-info">
            <div class="med-name">胃 药</div>
            <div class="med-dose">午餐后 · 1 粒 · 饭后服用</div>
          </div>
        </div>
        <div class="med-actions">
          <button class="btn-done">我已吃药 💊</button>
          <button class="btn-voice">🔊 听一遍</button>
        </div>
      </div>

      <!-- 晚上 -->
      <div class="group-label">
        <span class="gi">🌙</span>
        <b>晚 上</b>
        <span class="gstatus pending">待服药</span>
      </div>
      <div class="med-card">
        <div class="med-top">
          <div class="med-icon">❤️</div>
          <div class="med-info">
            <div class="med-name">降 压 药</div>
            <div class="med-dose">晚餐后 · 1 片 · 温水送服</div>
          </div>
        </div>
        <div class="med-actions">
          <button class="btn-done">我已吃药 💊</button>
          <button class="btn-voice">🔊 听一遍</button>
        </div>
      </div>
    </main>

    <nav class="nav">
      <div class="active"><span>🏠</span>首页</div>
      <div><span>💊</span>我的药</div>
      <div><span>👨‍👩‍👧</span>联系家人</div>
    </nav>
  </div>
</div>
</body>
</html>
