<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>老人模式 页面3 用药卡片</title>
<style>
:root{
  --screen:#f7fbf9;--primary:#16a085;--primary-dark:#0f766e;--soft:#e5f7f2;
  --text:#17212b;--muted:#667085;--line:#e5e7eb;--card:#fff;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px;background:linear-gradient(135deg,#edf8f3,#eaf4fb);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);}
.phone{width:330px;height:714px;background:#0b1220;border-radius:42px;padding:10px;box-shadow:0 18px 45px rgba(15,23,42,.20);position:relative;}
.phone:before{content:"";position:absolute;top:12px;left:50%;transform:translateX(-50%);width:92px;height:26px;background:#050505;border-radius:0 0 16px 16px;z-index:9}
.screen{height:100%;border-radius:34px;background:var(--screen);overflow:hidden;position:relative}
.status{height:40px;padding:11px 20px 0;display:flex;justify-content:space-between;font-size:11px;font-weight:800;position:relative;z-index:4}
.icons{display:flex;gap:4px;align-items:center}
.battery{width:20px;height:9px;border:1.5px solid #0f172a;border-radius:3px;position:relative}
.battery:after{content:"";position:absolute;left:2px;top:2px;width:12px;height:3px;background:#0f172a;border-radius:1px}

.header{padding:4px 16px 8px;display:flex;align-items:center;gap:10px}
.back-btn{width:40px;height:40px;border-radius:14px;background:#fff;display:grid;place-items:center;font-size:20px;border:1px solid rgba(226,232,240,.9);box-shadow:0 4px 12px rgba(15,23,42,.06);flex-shrink:0}
.header-title small{display:block;color:var(--muted);font-size:11px}
.header-title h1{margin:0;font-size:20px;font-weight:900}

.content{height:calc(100% - 40px - 58px);overflow-y:auto;padding:0 16px 90px;scrollbar-width:none}
.content::-webkit-scrollbar{display:none}
.nav{position:absolute;left:10px;right:10px;bottom:10px;height:60px;background:rgba(255,255,255,.96);border:1px solid #e5e7eb;border-radius:24px;display:grid;grid-template-columns:repeat(3,1fr);padding:6px;box-shadow:0 -10px 24px rgba(15,23,42,.07)}
.nav div{border-radius:17px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:#94a3b8;gap:2px}
.nav span{font-size:22px;line-height:1}
.nav .active{background:var(--soft);color:var(--primary)}

.warning-bar{background:#fff7ed;border:1px solid #fed7aa;border-radius:18px;padding:12px 13px;display:flex;gap:9px;align-items:flex-start;margin-bottom:13px}
.warning-bar span:first-child{font-size:20px;flex-shrink:0}
.warning-bar div b{display:block;font-size:13px;color:#9a3412;margin-bottom:3px}
.warning-bar div p{margin:0;font-size:11.5px;color:#c2410c;line-height:1.5}

.drug-hero{background:linear-gradient(135deg,#13b89a,#0f766e);border-radius:22px;padding:16px;margin-bottom:13px;color:#fff;display:flex;gap:13px;align-items:center;box-shadow:0 10px 24px rgba(15,118,110,.20)}
.drug-hero-icon{width:60px;height:60px;border-radius:20px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:32px;flex-shrink:0}
.drug-hero-name{font-size:22px;font-weight:900;margin:0 0 5px}
.drug-hero-sub{font-size:12px;color:rgba(255,255,255,.82)}

.section-title{font-size:16px;font-weight:900;color:var(--text);margin:14px 2px 9px;display:flex;align-items:center;gap:6px}
.section-title::before{content:"";width:4px;height:18px;background:var(--primary);border-radius:2px}

.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:13px}
.info-cell{background:#fff;border:1px solid #e8eef2;border-radius:18px;padding:13px;box-shadow:0 5px 14px rgba(15,23,42,.05)}
.info-cell small{display:block;color:var(--muted);font-size:11px;margin-bottom:5px}
.info-cell b{font-size:18px;font-weight:900;color:var(--text)}

.keyword-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:13px}
.kw{padding:8px 12px;border-radius:999px;font-size:13px;font-weight:900}
.kw.red{background:#fee2e2;color:#b91c1c}
.kw.orange{background:#fff7ed;color:#c2410c}
.kw.blue{background:#dbeafe;color:#1d4ed8}

.note-card{background:#fff;border:1px solid #e8eef2;border-radius:20px;padding:14px;margin-bottom:13px;box-shadow:0 5px 14px rgba(15,23,42,.05)}
.note-card p{margin:0;font-size:14px;color:#475569;line-height:1.7}

.action-row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.btn-a{height:52px;border-radius:16px;font-weight:900;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-a.primary{border:0;background:var(--primary);color:#fff;box-shadow:0 8px 20px rgba(22,160,133,.22)}
.btn-a.soft{border:1.5px solid rgba(22,160,133,.3);background:var(--soft);color:var(--primary-dark)}
</style>
</head>
<body>
<div class="phone">
  <div class="screen">
    <div class="status"><span>9:41</span><div class="icons"><span>●●●</span><span>5G</span><span class="battery"></span></div></div>

    <header class="header">
      <div class="back-btn">‹</div>
      <div class="header-title">
        <small>我的药 / 药品说明</small>
        <h1>用药卡片</h1>
      </div>
    </header>

    <main class="content">
      <div class="warning-bar">
        <span>⚠️</span>
        <div>
          <b>温馨提示</b>
          <p>本卡片仅整理说明书内容，用药请以医生或药师的建议为准。</p>
        </div>
      </div>

      <div class="drug-hero">
        <div class="drug-hero-icon">❤️</div>
        <div>
          <div class="drug-hero-name">降 压 药</div>
          <div class="drug-hero-sub">规格：5mg × 30 片 · 爷爷长期用药</div>
        </div>
      </div>

      <div class="section-title">怎么吃</div>
      <div class="info-grid">
        <div class="info-cell"><small>一次吃多少</small><b>1 片</b></div>
        <div class="info-cell"><small>一天吃几次</small><b>2 次</b></div>
        <div class="info-cell"><small>什么时候吃</small><b>饭 后</b></div>
        <div class="info-cell"><small>用什么送服</small><b>温水</b></div>
      </div>

      <div class="section-title">注意事项</div>
      <div class="keyword-row">
        <span class="kw red">不能漏服</span>
        <span class="kw orange">避免饮酒</span>
        <span class="kw blue">饭后服用</span>
      </div>
      <div class="note-card">
        <p>每天按时服药，不要自行停药或加量。如果头晕、心跳加快，请马上告诉家人或联系医生。</p>
      </div>

      <div class="action-row">
        <button class="btn-a primary">🔊 听一遍用法</button>
        <button class="btn-a soft">⏰ 查看提醒</button>
      </div>
    </main>

    <nav class="nav">
      <div><span>🏠</span>首页</div>
      <div class="active"><span>💊</span>我的药</div>
      <div><span>👨‍👩‍👧</span>联系家人</div>
    </nav>
  </div>
</div>
</body>
</html>
