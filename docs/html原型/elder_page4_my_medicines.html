<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>老人模式 页面4 我的药</title>
<style>
:root{
  --screen:#f7fbf9;--primary:#16a085;--primary-dark:#0f766e;--soft:#e5f7f2;
  --text:#17212b;--muted:#667085;--line:#e5e7eb;--card:#fff;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px;background:linear-gradient(135deg,#edf8f3,#eaf4fb);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);}
.phone{width:330px;height:714px;background:#0b1220;border-radius:42px;padding:10px;box-shadow:0 18px 45px rgba(15,23,42,.20);position:relative;}
.phone:before{content:"";position:absolute;top:12px;left:50%;transform:translateX(-50%);width:92px;height:26px;background:#050505;border-radius:0 0 16px 16px;z-index:9}
.screen{height:100%;border-radius:34px;background:var(--screen);overflow:hidden;position:relative}
.status{height:40px;padding:11px 20px 0;display:flex;justify-content:space-between;font-size:11px;font-weight:800;position:relative;z-index:4}
.icons{display:flex;gap:4px;align-items:center}
.battery{width:20px;height:9px;border:1.5px solid #0f172a;border-radius:3px;position:relative}
.battery:after{content:"";position:absolute;left:2px;top:2px;width:12px;height:3px;background:#0f172a;border-radius:1px}

.header{padding:6px 16px 10px}
.header small{display:block;color:var(--muted);font-size:12px;margin-bottom:2px}
.header h1{margin:0;font-size:22px;font-weight:900}

.content{height:calc(100% - 40px - 58px);overflow-y:auto;padding:0 16px 90px;scrollbar-width:none}
.content::-webkit-scrollbar{display:none}
.nav{position:absolute;left:10px;right:10px;bottom:10px;height:60px;background:rgba(255,255,255,.96);border:1px solid #e5e7eb;border-radius:24px;display:grid;grid-template-columns:repeat(3,1fr);padding:6px;box-shadow:0 -10px 24px rgba(15,23,42,.07)}
.nav div{border-radius:17px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:#94a3b8;gap:2px}
.nav span{font-size:22px;line-height:1}
.nav .active{background:var(--soft);color:var(--primary)}

.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat-cell{background:#fff;border:1px solid #e8eef2;border-radius:18px;padding:12px 8px;text-align:center;box-shadow:0 5px 14px rgba(15,23,42,.05)}
.stat-cell b{display:block;font-size:22px;font-weight:900;color:var(--primary-dark)}
.stat-cell span{font-size:11px;color:var(--muted)}

.section-title{font-size:16px;font-weight:900;color:var(--text);margin:0 2px 9px;display:flex;align-items:center;gap:6px}
.section-title::before{content:"";width:4px;height:18px;background:var(--primary);border-radius:2px}

.med-card{background:#fff;border:1px solid #e8eef2;border-radius:22px;padding:14px;margin-bottom:10px;box-shadow:0 6px 18px rgba(15,23,42,.05)}
.med-top{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.med-icon{width:50px;height:50px;border-radius:17px;background:var(--soft);display:grid;place-items:center;font-size:28px;flex-shrink:0}
.med-main{flex:1}
.med-name{font-size:18px;font-weight:900;margin:0 0 3px}
.med-sub{font-size:12.5px;color:var(--muted)}
.tag{display:inline-flex;padding:6px 10px;border-radius:999px;font-size:11px;font-weight:900;white-space:nowrap;align-self:flex-start}
.tag.green{background:#dcfce7;color:#15803d}
.tag.orange{background:#fff7ed;color:#c2410c}
.tag.red{background:#fee2e2;color:#b91c1c}
.tag.blue{background:#dbeafe;color:#1d4ed8}

.med-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.meta-cell{background:#f8fafc;border-radius:13px;padding:9px 7px}
.meta-cell small{display:block;color:var(--muted);font-size:10px;margin-bottom:4px}
.meta-cell b{font-size:13px;font-weight:900}

.add-btn{width:100%;height:56px;border:2px dashed rgba(22,160,133,.4);background:rgba(229,247,242,.5);border-radius:20px;color:var(--primary);font-size:16px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:4px}
</style>
</head>
<body>
<div class="phone">
  <div class="screen">
    <div class="status"><span>9:41</span><div class="icons"><span>●●●</span><span>5G</span><span class="battery"></span></div></div>

    <header class="header">
      <small>我的药品管理</small>
      <h1>我 的 药 💊</h1>
    </header>

    <main class="content">
      <div class="stats-row">
        <div class="stat-cell"><b>3</b><span>种药</span></div>
        <div class="stat-cell"><b>2</b><span>长期用</span></div>
        <div class="stat-cell"><b>1</b><span>快没了</span></div>
      </div>

      <div class="section-title">每天要吃的药</div>

      <!-- 降压药 -->
      <div class="med-card">
        <div class="med-top">
          <div class="med-icon">❤️</div>
          <div class="med-main">
            <div class="med-name">降 压 药</div>
            <div class="med-sub">每天 2 次 · 早晚饭后 · 床头柜</div>
          </div>
          <span class="tag orange">快没了</span>
        </div>
        <div class="med-meta">
          <div class="meta-cell"><small>位置</small><b>床头柜</b></div>
          <div class="meta-cell"><small>还剩</small><b>5 天量</b></div>
          <div class="meta-cell"><small>有效期</small><b>2027-03</b></div>
        </div>
      </div>

      <!-- 胃药 -->
      <div class="med-card">
        <div class="med-top">
          <div class="med-icon">💊</div>
          <div class="med-main">
            <div class="med-name">胃 药</div>
            <div class="med-sub">每天 1 次 · 午饭后 · 客厅药箱</div>
          </div>
          <span class="tag green">正常</span>
        </div>
        <div class="med-meta">
          <div class="meta-cell"><small>位置</small><b>客厅药箱</b></div>
          <div class="meta-cell"><small>还剩</small><b>20 天量</b></div>
          <div class="meta-cell"><small>有效期</small><b>2027-06</b></div>
        </div>
      </div>

      <!-- 感冒药 -->
      <div class="med-card">
        <div class="med-top">
          <div class="med-icon">🧪</div>
          <div class="med-main">
            <div class="med-name">感冒灵颗粒</div>
            <div class="med-sub">需要时 · 卧室抽屉</div>
          </div>
          <span class="tag red">快过期</span>
        </div>
        <div class="med-meta">
          <div class="meta-cell"><small>位置</small><b>卧室抽屉</b></div>
          <div class="meta-cell"><small>还剩</small><b>3 袋</b></div>
          <div class="meta-cell"><small>有效期</small><b>12天后</b></div>
        </div>
      </div>

      <button class="add-btn">📞 请家人帮我添加药品</button>
    </main>

    <nav class="nav">
      <div><span>🏠</span>首页</div>
      <div class="active"><span>💊</span>我的药</div>
      <div><span>👨‍👩‍👧</span>联系家人</div>
    </nav>
  </div>
</div>
</body>
</html>
