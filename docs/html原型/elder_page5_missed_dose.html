<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>老人模式 页面5 漏服提示</title>
<style>
:root{
  --screen:#f7fbf9;--primary:#16a085;--primary-dark:#0f766e;--soft:#e5f7f2;
  --text:#17212b;--muted:#667085;--line:#e5e7eb;--card:#fff;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px;background:linear-gradient(135deg,#edf8f3,#eaf4fb);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);}
.phone{width:330px;height:714px;background:#0b1220;border-radius:42px;padding:10px;box-shadow:0 18px 45px rgba(15,23,42,.20);position:relative;}
.phone:before{content:"";position:absolute;top:12px;left:50%;transform:translateX(-50%);width:92px;height:26px;background:#050505;border-radius:0 0 16px 16px;z-index:9}
.screen{height:100%;border-radius:34px;background:var(--screen);overflow:hidden;position:relative}
.status{height:40px;padding:11px 20px 0;display:flex;justify-content:space-between;font-size:11px;font-weight:800;position:relative;z-index:4}
.icons{display:flex;gap:4px;align-items:center}
.battery{width:20px;height:9px;border:1.5px solid #0f172a;border-radius:3px;position:relative}
.battery:after{content:"";position:absolute;left:2px;top:2px;width:12px;height:3px;background:#0f172a;border-radius:1px}
.content{height:calc(100% - 40px);overflow-y:auto;padding:14px 16px 20px;scrollbar-width:none}
.content::-webkit-scrollbar{display:none}

.missed-hero{background:linear-gradient(135deg,#f59e0b,#ef4444);border-radius:24px;padding:20px 18px;text-align:center;margin-bottom:14px;box-shadow:0 14px 30px rgba(239,68,68,.20);position:relative;overflow:hidden}
.missed-hero::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.10)}
.missed-icon{font-size:52px;margin-bottom:10px;position:relative;z-index:1}
.missed-hero h2{margin:0 0 6px;font-size:22px;font-weight:900;color:#fff;position:relative;z-index:1}
.missed-hero p{margin:0;font-size:13px;color:rgba(255,255,255,.90);line-height:1.55;position:relative;z-index:1}

.miss-info-card{background:#fff;border:1px solid #e8eef2;border-radius:22px;padding:15px;margin-bottom:12px;box-shadow:0 6px 18px rgba(15,23,42,.06)}
.miss-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0}
.miss-row+.miss-row{border-top:1px solid #f1f5f9}
.miss-label{font-size:14px;color:var(--muted);font-weight:600}
.miss-value{font-size:18px;font-weight:900}
.miss-value.big{font-size:20px;color:#ef4444}

.advice-card{background:#fff7ed;border:1px solid #fed7aa;border-radius:20px;padding:14px;margin-bottom:14px;display:flex;gap:10px}
.advice-card .ai{font-size:22px;flex-shrink:0}
.advice-card h4{margin:0 0 5px;font-size:14px;color:#9a3412;font-weight:900}
.advice-card p{margin:0;font-size:12.5px;color:#c2410c;line-height:1.55}

.actions{display:grid;gap:10px}
.btn-primary{border:0;background:var(--primary);color:#fff;height:58px;border-radius:18px;font-weight:900;font-size:19px;box-shadow:0 10px 24px rgba(22,160,133,.25);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-warn{border:0;background:#ef4444;color:#fff;height:56px;border-radius:18px;font-weight:900;font-size:18px;box-shadow:0 8px 20px rgba(239,68,68,.25);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-secondary{border:1.5px solid rgba(22,160,133,.3);background:var(--soft);color:var(--primary-dark);height:52px;border-radius:18px;font-weight:900;font-size:16px;cursor:pointer}
</style>
</head>
<body>
<div class="phone">
  <div class="screen">
    <div class="status"><span>21:30</span><div class="icons"><span>●●●</span><span>5G</span><span class="battery"></span></div></div>
    <main class="content">
      <div class="missed-hero">
        <div class="missed-icon">⚠️</div>
        <h2>有一次药忘吃了</h2>
        <p>晚上 8 点的降压药还没有确认，<br/>已经过去 1 小时 30 分钟了。</p>
      </div>

      <div class="miss-info-card">
        <div class="miss-row">
          <span class="miss-label">忘吃的药</span>
          <span class="miss-value big">降 压 药</span>
        </div>
        <div class="miss-row">
          <span class="miss-label">原定时间</span>
          <span class="miss-value">晚上 8:00</span>
        </div>
        <div class="miss-row">
          <span class="miss-label">一次用量</span>
          <span class="miss-value">1 片</span>
        </div>
        <div class="miss-row">
          <span class="miss-label">药在哪里</span>
          <span class="miss-value">📍 床头柜</span>
        </div>
      </div>

      <div class="advice-card">
        <span class="ai">🛡️</span>
        <div>
          <h4>重要提示</h4>
          <p>漏服是否补服，请联系家人或咨询医生，不要自行决定补服或加量。</p>
        </div>
      </div>

      <div class="actions">
        <button class="btn-primary">✅ 我刚才已经吃了</button>
        <button class="btn-warn">📞 马上联系家人</button>
        <button class="btn-secondary">⏱️ 等家人来确认</button>
      </div>
    </main>
  </div>
</div>
</body>
</html>
