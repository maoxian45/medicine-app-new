<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>老人模式 页面6 联系家人</title>
<style>
:root{
  --screen:#f7fbf9;--primary:#16a085;--primary-dark:#0f766e;--soft:#e5f7f2;
  --text:#17212b;--muted:#667085;--line:#e5e7eb;--card:#fff;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px;background:linear-gradient(135deg,#edf8f3,#eaf4fb);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);}
.phone{width:330px;height:714px;background:#0b1220;border-radius:42px;padding:10px;box-shadow:0 18px 45px rgba(15,23,42,.20);position:relative;}
.phone:before{content:"";position:absolute;top:12px;left:50%;transform:translateX(-50%);width:92px;height:26px;background:#050505;border-radius:0 0 16px 16px;z-index:9}
.screen{height:100%;border-radius:34px;background:var(--screen);overflow:hidden;position:relative}
.status{height:40px;padding:11px 20px 0;display:flex;justify-content:space-between;font-size:11px;font-weight:800;position:relative;z-index:4}
.icons{display:flex;gap:4px;align-items:center}
.battery{width:20px;height:9px;border:1.5px solid #0f172a;border-radius:3px;position:relative}
.battery:after{content:"";position:absolute;left:2px;top:2px;width:12px;height:3px;background:#0f172a;border-radius:1px}

.header{padding:6px 16px 10px}
.header small{display:block;color:var(--muted);font-size:12px;margin-bottom:2px}
.header h1{margin:0;font-size:22px;font-weight:900}

.content{height:calc(100% - 40px - 58px);overflow-y:auto;padding:0 16px 90px;scrollbar-width:none}
.content::-webkit-scrollbar{display:none}
.nav{position:absolute;left:10px;right:10px;bottom:10px;height:60px;background:rgba(255,255,255,.96);border:1px solid #e5e7eb;border-radius:24px;display:grid;grid-template-columns:repeat(3,1fr);padding:6px;box-shadow:0 -10px 24px rgba(15,23,42,.07)}
.nav div{border-radius:17px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:#94a3b8;gap:2px}
.nav span{font-size:22px;line-height:1}
.nav .active{background:var(--soft);color:var(--primary)}

.sos-banner{background:linear-gradient(135deg,#ef4444,#dc2626);border-radius:22px;padding:15px 16px;margin-bottom:14px;display:flex;gap:12px;align-items:center;box-shadow:0 10px 24px rgba(239,68,68,.25);cursor:pointer}
.sos-icon{width:54px;height:54px;border-radius:18px;background:rgba(255,255,255,.20);display:grid;place-items:center;font-size:30px;flex-shrink:0}
.sos-text{color:#fff}
.sos-text h3{margin:0 0 4px;font-size:18px;font-weight:900}
.sos-text p{margin:0;font-size:12px;color:rgba(255,255,255,.88)}
.sos-arrow{margin-left:auto;color:rgba(255,255,255,.7);font-size:22px}

.section-title{font-size:16px;font-weight:900;color:var(--text);margin:0 2px 9px;display:flex;align-items:center;gap:6px}
.section-title::before{content:"";width:4px;height:18px;background:var(--primary);border-radius:2px}

.member-card{background:#fff;border:1px solid #e8eef2;border-radius:22px;padding:14px;margin-bottom:10px;box-shadow:0 6px 18px rgba(15,23,42,.05)}
.member-top{display:flex;align-items:center;gap:11px;margin-bottom:12px}
.member-avatar{width:52px;height:52px;border-radius:18px;background:var(--soft);display:grid;place-items:center;font-size:30px;flex-shrink:0}
.member-info h3{margin:0 0 3px;font-size:18px;font-weight:900}
.member-info span{font-size:12.5px;color:var(--muted)}
.online-dot{width:10px;height:10px;border-radius:50%;background:#22c55e;margin-left:auto;box-shadow:0 0 0 3px rgba(34,197,94,.2)}

.member-btns{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.btn-call{border:0;background:#22c55e;color:#fff;height:52px;border-radius:15px;font-weight:900;font-size:17px;box-shadow:0 6px 16px rgba(34,197,94,.25);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-msg{border:1.5px solid #e5e7eb;background:#f8fafc;color:var(--text);height:52px;border-radius:15px;font-weight:900;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}

.status-note{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:16px;padding:11px 13px;display:flex;gap:8px;align-items:center;margin-top:4px}
.status-note span{font-size:18px}
.status-note p{margin:0;font-size:12px;color:#15803d;font-weight:700}
</style>
</head>
<body>
<div class="phone">
  <div class="screen">
    <div class="status"><span>9:41</span><div class="icons"><span>●●●</span><span>5G</span><span class="battery"></span></div></div>

    <header class="header">
      <small>随时联系家人</small>
      <h1>联系家人 👨‍👩‍👧</h1>
    </header>

    <main class="content">
      <!-- SOS快速呼叫 -->
      <div class="sos-banner">
        <div class="sos-icon">🆘</div>
        <div class="sos-text">
          <h3>紧急呼叫</h3>
          <p>有急事按这里，一键通知全家</p>
        </div>
        <span class="sos-arrow">›</span>
      </div>

      <div class="section-title">家庭成员</div>

      <!-- 子女 Claire -->
      <div class="member-card">
        <div class="member-top">
          <div class="member-avatar">👩</div>
          <div class="member-info">
            <h3>Claire（孙女）</h3>
            <span>负责管理药品，今天在线</span>
          </div>
          <div class="online-dot"></div>
        </div>
        <div class="member-btns">
          <button class="btn-call">📞 打电话</button>
          <button class="btn-msg">💬 发消息</button>
        </div>
      </div>

      <!-- 儿子 -->
      <div class="member-card">
        <div class="member-top">
          <div class="member-avatar">👨</div>
          <div class="member-info">
            <h3>大儿子</h3>
            <span>家庭药箱管理员</span>
          </div>
          <div class="online-dot"></div>
        </div>
        <div class="member-btns">
          <button class="btn-call">📞 打电话</button>
          <button class="btn-msg">💬 发消息</button>
        </div>
      </div>

      <!-- 奶奶 -->
      <div class="member-card">
        <div class="member-top">
          <div class="member-avatar">👵</div>
          <div class="member-info">
            <h3>奶奶</h3>
            <span>一起使用药明白</span>
          </div>
          <div class="online-dot" style="background:#94a3b8;box-shadow:none"></div>
        </div>
        <div class="member-btns">
          <button class="btn-call">📞 打电话</button>
          <button class="btn-msg">💬 发消息</button>
        </div>
      </div>

      <div class="status-note">
        <span>✅</span>
        <p>家人可以实时看到您今天的服药情况，放心！</p>
      </div>
    </main>

    <nav class="nav">
      <div><span>🏠</span>首页</div>
      <div><span>💊</span>我的药</div>
      <div class="active"><span>👨‍👩‍👧</span>联系家人</div>
    </nav>
  </div>
</div>
</body>
</html>
