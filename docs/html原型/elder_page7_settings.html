<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>老人模式 页面7 设置</title>
<style>
:root{
  --screen:#f7fbf9;--primary:#16a085;--primary-dark:#0f766e;--soft:#e5f7f2;
  --text:#17212b;--muted:#667085;--line:#e5e7eb;--card:#fff;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px;background:linear-gradient(135deg,#edf8f3,#eaf4fb);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);}
.phone{width:330px;height:714px;background:#0b1220;border-radius:42px;padding:10px;box-shadow:0 18px 45px rgba(15,23,42,.20);position:relative;}
.phone:before{content:"";position:absolute;top:12px;left:50%;transform:translateX(-50%);width:92px;height:26px;background:#050505;border-radius:0 0 16px 16px;z-index:9}
.screen{height:100%;border-radius:34px;background:var(--screen);overflow:hidden;position:relative}
.status{height:40px;padding:11px 20px 0;display:flex;justify-content:space-between;font-size:11px;font-weight:800;position:relative;z-index:4}
.icons{display:flex;gap:4px;align-items:center}
.battery{width:20px;height:9px;border:1.5px solid #0f172a;border-radius:3px;position:relative}
.battery:after{content:"";position:absolute;left:2px;top:2px;width:12px;height:3px;background:#0f172a;border-radius:1px}

.header{padding:6px 16px 10px}
.header small{display:block;color:var(--muted);font-size:12px;margin-bottom:2px}
.header h1{margin:0;font-size:22px;font-weight:900}

.content{height:calc(100% - 40px - 58px);overflow-y:auto;padding:0 16px 90px;scrollbar-width:none}
.content::-webkit-scrollbar{display:none}
.nav{position:absolute;left:10px;right:10px;bottom:10px;height:60px;background:rgba(255,255,255,.96);border:1px solid #e5e7eb;border-radius:24px;display:grid;grid-template-columns:repeat(3,1fr);padding:6px;box-shadow:0 -10px 24px rgba(15,23,42,.07)}
.nav div{border-radius:17px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:#94a3b8;gap:2px}
.nav span{font-size:22px;line-height:1}
.nav .active{background:var(--soft);color:var(--primary)}

/* Profile card */
.profile-card{background:linear-gradient(135deg,#13b89a,#0f766e);border-radius:22px;padding:15px 16px;margin-bottom:14px;display:flex;gap:12px;align-items:center;box-shadow:0 10px 24px rgba(15,118,110,.20)}
.profile-avatar{width:56px;height:56px;border-radius:20px;background:rgba(255,255,255,.20);display:grid;place-items:center;font-size:32px;flex-shrink:0}
.profile-info h3{margin:0 0 4px;font-size:20px;font-weight:900;color:#fff}
.profile-info span{font-size:12.5px;color:rgba(255,255,255,.82)}
.profile-badge{margin-left:auto;background:rgba(255,255,255,.20);border-radius:12px;padding:7px 10px;font-size:11.5px;font-weight:900;color:#fff;text-align:center;line-height:1.3}

.section-title{font-size:15px;font-weight:900;color:var(--muted);margin:14px 2px 8px;text-transform:uppercase;letter-spacing:.04em}

/* Switch row */
.switch-row{background:#fff;border:1px solid #e8eef2;border-radius:20px;padding:13px 14px;margin-bottom:9px;display:flex;align-items:center;gap:12px;box-shadow:0 5px 14px rgba(15,23,42,.05)}
.switch-icon{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;font-size:24px;flex-shrink:0}
.switch-icon.green{background:#dcfce7}
.switch-icon.blue{background:#dbeafe}
.switch-icon.orange{background:#fff7ed}
.switch-icon.purple{background:#f3e8ff}
.switch-text{flex:1}
.switch-text b{display:block;font-size:15px;font-weight:900;margin-bottom:2px}
.switch-text small{font-size:11.5px;color:var(--muted)}
.toggle{width:46px;height:26px;border-radius:999px;position:relative;flex-shrink:0;cursor:pointer}
.toggle.on{background:var(--primary)}
.toggle.off{background:#e2e8f0}
.toggle::after{content:"";position:absolute;width:20px;height:20px;top:3px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.15);transition:.2s}
.toggle.on::after{right:3px}
.toggle.off::after{left:3px}

/* Font size selector */
.font-selector{background:#fff;border:1px solid #e8eef2;border-radius:20px;padding:13px 14px;margin-bottom:9px;box-shadow:0 5px 14px rgba(15,23,42,.05)}
.font-selector-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.font-label{flex:1}
.font-label b{display:block;font-size:15px;font-weight:900;margin-bottom:2px}
.font-label small{font-size:11.5px;color:var(--muted)}
.font-opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.font-opt{height:44px;border-radius:13px;border:1.5px solid #e5e7eb;background:#f8fafc;font-weight:900;color:var(--muted);cursor:pointer}
.font-opt.active{border-color:var(--primary);background:var(--soft);color:var(--primary-dark)}
.font-opt.s{font-size:13px}
.font-opt.m{font-size:16px}
.font-opt.l{font-size:20px}

/* Arrow row */
.arrow-row{background:#fff;border:1px solid #e8eef2;border-radius:20px;padding:13px 14px;margin-bottom:9px;display:flex;align-items:center;gap:12px;box-shadow:0 5px 14px rgba(15,23,42,.05);cursor:pointer}
.arrow-row-icon{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;font-size:24px;flex-shrink:0}
.arrow-row-icon.red{background:#fee2e2}
.arrow-row-text{flex:1}
.arrow-row-text b{display:block;font-size:15px;font-weight:900;margin-bottom:2px}
.arrow-row-text small{font-size:11.5px;color:var(--muted)}
.arrow{font-size:18px;color:#94a3b8}

/* Exit button */
.exit-btn{width:100%;height:54px;border:2px solid #e2e8f0;background:#fff;border-radius:18px;color:#94a3b8;font-size:16px;font-weight:900;cursor:pointer;margin-top:4px}
</style>
</head>
<body>
<div class="phone">
  <div class="screen">
    <div class="status"><span>9:41</span><div class="icons"><span>●●●</span><span>5G</span><span class="battery"></span></div></div>

    <header class="header">
      <small>个人偏好设置</small>
      <h1>我 的 设 置 ⚙️</h1>
    </header>

    <main class="content">
      <!-- 个人信息 -->
      <div class="profile-card">
        <div class="profile-avatar">👴</div>
        <div class="profile-info">
          <h3>爷 爷</h3>
          <span>家庭成员 · 药明白</span>
        </div>
        <div class="profile-badge">👴<br/>老人模式<br/>已开启</div>
      </div>

      <div class="section-title">辅助功能</div>

      <!-- 语音播报 -->
      <div class="switch-row">
        <div class="switch-icon green">🔊</div>
        <div class="switch-text">
          <b>语音播报</b>
          <small>服药卡片和提醒自动朗读</small>
        </div>
        <div class="toggle on"></div>
      </div>

      <!-- 字体大小 -->
      <div class="font-selector">
        <div class="font-selector-top">
          <div class="switch-icon blue">🔤</div>
          <div class="font-label">
            <b>字体大小</b>
            <small>当前：大号字体</small>
          </div>
        </div>
        <div class="font-opts">
          <button class="font-opt s">小</button>
          <button class="font-opt m">中</button>
          <button class="font-opt l active">大</button>
        </div>
      </div>

      <!-- 高对比 -->
      <div class="switch-row">
        <div class="switch-icon orange">🌟</div>
        <div class="switch-text">
          <b>高对比显示</b>
          <small>文字更粗，颜色更鲜明</small>
        </div>
        <div class="toggle on"></div>
      </div>

      <!-- 提醒声音 -->
      <div class="switch-row">
        <div class="switch-icon purple">🔔</div>
        <div class="switch-text">
          <b>服药铃声提醒</b>
          <small>到时间会响铃并震动</small>
        </div>
        <div class="toggle on"></div>
      </div>

      <div class="section-title">关于与帮助</div>

      <div class="arrow-row">
        <div class="arrow-row-icon" style="background:#f0fdf4">🛡️</div>
        <div class="arrow-row-text">
          <b>医疗安全说明</b>
          <small>本应用不替代医生和药师建议</small>
        </div>
        <span class="arrow">›</span>
      </div>

      <div class="arrow-row">
        <div class="arrow-row-icon red">🚪</div>
        <div class="arrow-row-text">
          <b>退出老人模式</b>
          <small>切换回普通界面</small>
        </div>
        <span class="arrow">›</span>
      </div>
    </main>

    <nav class="nav">
      <div><span>🏠</span>首页</div>
      <div><span>💊</span>我的药</div>
      <div class="active"><span>👨‍👩‍👧</span>联系家人</div>
    </nav>
  </div>
</div>
</body>
</html>
