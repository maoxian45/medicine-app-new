<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>页面2 添加药品</title>
<style>
:root{
  --screen:#f7fbf9;--primary:#16a085;--primary-dark:#0f766e;--soft:#e5f7f2;
  --text:#17212b;--muted:#667085;--line:#e5e7eb;--card:#fff;
  --orange:#f59e0b;--red:#ef4444;--blue:#3b82f6;--green:#22c55e;
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:18px;background:linear-gradient(135deg,#edf8f3,#eaf4fb);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);
}
.phone{
  width:330px;height:714px;background:#0b1220;border-radius:42px;padding:10px;
  box-shadow:0 18px 45px rgba(15,23,42,.20);position:relative;
}
.phone:before{content:"";position:absolute;top:12px;left:50%;transform:translateX(-50%);width:92px;height:26px;background:#050505;border-radius:0 0 16px 16px;z-index:9}
.screen{height:100%;border-radius:34px;background:var(--screen);overflow:hidden;position:relative}
.status{height:40px;padding:11px 20px 0;display:flex;justify-content:space-between;font-size:11px;font-weight:800;position:relative;z-index:4}
.icons{display:flex;gap:4px;align-items:center}.battery{width:20px;height:9px;border:1.5px solid #0f172a;border-radius:3px;position:relative}.battery:after{content:"";position:absolute;left:2px;top:2px;width:12px;height:3px;background:#0f172a;border-radius:1px}
.header{padding:0 18px 10px}.headrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.title small{display:block;color:var(--muted);font-size:11px;margin-bottom:3px}.title h1{margin:0;font-size:21px;letter-spacing:-.02em}
.iconbtn,.avatar{width:36px;height:36px;border-radius:14px;background:#fff;display:grid;place-items:center;border:1px solid rgba(226,232,240,.9);box-shadow:0 6px 16px rgba(15,23,42,.06)}
.content{height:calc(100% - 40px - 58px);overflow-y:auto;padding:0 18px 78px;scrollbar-width:none}.content::-webkit-scrollbar{display:none}
.content.no-nav{height:calc(100% - 40px);padding-bottom:18px}
.nav{position:absolute;left:10px;right:10px;bottom:10px;height:62px;background:rgba(255,255,255,.94);border:1px solid #e5e7eb;border-radius:24px;display:grid;grid-template-columns:repeat(5,1fr);padding:7px;box-shadow:0 -10px 24px rgba(15,23,42,.07)}
.nav div{border-radius:17px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:#94a3b8}.nav span{font-size:17px}.nav .active{background:var(--soft);color:var(--primary)}
.hero{border-radius:24px;background:linear-gradient(135deg,#13b89a,#0f766e);color:#fff;padding:17px;box-shadow:0 12px 25px rgba(15,118,110,.20);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-38px;top:-32px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero h2{margin:0 0 6px;font-size:18px;position:relative}.hero p{margin:0;color:rgba(255,255,255,.86);font-size:12px;line-height:1.5;position:relative}
.hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;position:relative;z-index:1}
.expand{border:0;background:rgba(255,255,255,.20);color:#fff;border-radius:999px;padding:7px 10px;font-size:11px;font-weight:900;white-space:nowrap}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:13px;position:relative;z-index:1}
.metric{background:rgba(255,255,255,.16);border-radius:14px;padding:8px 5px;text-align:center}.metric b{display:block;font-size:17px}.metric span{font-size:10px;color:rgba(255,255,255,.82)}
.section{display:flex;align-items:center;justify-content:space-between;margin:15px 2px 9px}.section h3{margin:0;font-size:15px}.section a{font-size:11px;color:var(--primary);font-weight:900;text-decoration:none}
.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.quick .q{background:#fff;border:1px solid #e8eef2;border-radius:20px;padding:13px;min-height:91px;box-shadow:0 7px 16px rgba(15,23,42,.04)}
.q i{width:36px;height:36px;border-radius:14px;background:var(--soft);display:grid;place-items:center;font-style:normal;font-size:20px;margin-bottom:8px}.q b{display:block;font-size:14px;margin-bottom:3px}.q span{font-size:10px;color:var(--muted);line-height:1.4}
.notice,.card{background:#fff;border:1px solid #e8eef2;border-radius:20px;padding:13px;box-shadow:0 7px 18px rgba(15,23,42,.04)}
.notice{display:flex;gap:9px;margin-bottom:9px}.notice b{font-size:12px;display:block;margin-bottom:3px}.notice span{font-size:10.5px;color:var(--muted);line-height:1.45}
.tag{display:inline-flex;padding:5px 8px;border-radius:999px;font-size:10px;font-weight:900;white-space:nowrap}.green{background:#dcfce7;color:#15803d}.orange{background:#fff7ed;color:#c2410c}.red{background:#fee2e2;color:#b91c1c}.blue{background:#dbeafe;color:#1d4ed8}.gray{background:#f1f5f9;color:#475569}
.primary{width:100%;border:0;background:var(--primary);color:#fff;height:46px;border-radius:16px;font-weight:900;font-size:14px;box-shadow:0 10px 22px rgba(22,160,133,.22)}
.secondary{width:100%;border:1px solid rgba(22,160,133,.25);background:var(--soft);color:var(--primary-dark);height:44px;border-radius:16px;font-weight:900;font-size:13px}
.search{display:flex;gap:8px;align-items:center;background:#f1f5f9;border-radius:15px;padding:11px 12px;color:#94a3b8;font-size:12px}
.fieldgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.field{background:#f8fafc;border-radius:16px;padding:11px;min-height:62px}.field small{display:block;color:var(--muted);font-size:10px;margin-bottom:5px}.field b{font-size:14px}
.chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{white-space:nowrap;padding:8px 11px;border-radius:999px;background:#f1f5f9;color:#475569;font-size:11px;font-weight:900}.chip.active{background:var(--primary);color:#fff}
@media(max-height:760px){.phone{width:310px;height:671px;border-radius:39px}.screen{border-radius:31px}.content{padding-left:16px;padding-right:16px}}

.scan-card {
  margin-top:4px;height:196px;border-radius:26px;
  background:
    linear-gradient(rgba(15,118,110,.10),rgba(15,118,110,.10)),
    repeating-linear-gradient(45deg,#f8fafc 0,#f8fafc 12px,#f1f5f9 12px,#f1f5f9 24px);
  border:1.7px dashed rgba(22,160,133,.50);
  display:grid;place-items:center;text-align:center;padding:20px;color:var(--primary-dark);
}
.scan-lens {
  width:78px;height:78px;border-radius:25px;margin:0 auto 11px;background:#fff;
  display:grid;place-items:center;font-size:38px;box-shadow:0 12px 28px rgba(15,118,110,.13);
}
.scan-card strong {font-size:15px}
.scan-card p {margin:7px 0 0;font-size:11px;line-height:1.55;color:#0f766e}
.recent-list {display:grid;gap:9px}
.med-row {
  background:#fff;border:1px solid #e8eef2;border-radius:18px;padding:12px;
  display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;
  box-shadow:0 7px 18px rgba(15,23,42,.04);
}
.med-icon {width:40px;height:40px;border-radius:14px;background:var(--soft);display:grid;place-items:center;font-size:20px}
.med-row b {display:block;font-size:13px;margin-bottom:3px}
.med-row small {color:var(--muted);font-size:10.5px}
</style>
</head>
<body>
  <div class="phone">
    <div class="screen">
      <div class="status"><span>9:41</span><div class="icons"><span>●●●</span><span>5G</span><span class="battery"></span></div></div>

      <header class="header">
        <div class="headrow">
          <div class="iconbtn">‹</div>
          <div class="title" style="flex:1"><small>添加药品</small><h1>拍照或搜索药品</h1></div>
          <div class="iconbtn">?</div>
        </div>
      </header>

      <main class="content">
        <section class="scan-card">
          <div>
            <div class="scan-lens">📷</div>
            <strong>拍摄药盒 / 说明书</strong>
            <p>对准药品名称、用法用量、禁忌和注意事项，识别后生成用药卡片。</p>
          </div>
        </section>

        <div class="section"><h3>搜索药品</h3></div>
        <section class="card">
          <div class="search"><span>🔎</span><span>输入药品名称</span></div>
        </section>

        <div class="section"><h3>最近添加</h3></div>
        <section class="recent-list">
          <div class="med-row">
            <div class="med-icon">💊</div>
            <div><b>维生素 D</b><small>成人常备药 · 卧室抽屉</small></div>
            <span class="tag green">正常</span>
          </div>
          <div class="med-row">
            <div class="med-icon">🧴</div>
            <div><b>布洛芬混悬液</b><small>儿童药 · 儿童药盒</small></div>
            <span class="tag orange">需核对</span>
          </div>
        </section>

        <div class="section"><h3>识别说明</h3></div>
        <div class="notice" style="background:#fffbeb;border-color:#fde68a;color:#92400e">
          <span>🛡️</span>
          <div><b>安全边界</b><span>本 App 只整理说明书信息与提醒计划，不提供诊断、处方或药品推荐。</span></div>
        </div>
      </main>

      <nav class="nav">
        <div><span>🏠</span>首页</div>
        <div class="active"><span>📷</span>扫一扫</div>
        <div><span>🧰</span>药箱</div>
        <div><span>👨‍👩‍👧</span>家人</div>
        <div><span>⚙️</span>我的</div>
      </nav>
    </div>
  </div>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js/v833ccba57c9e4d2798f2e76cebdd09a11778172276447" integrity="sha512-57MDmcccJXYtNnH+ZiBwzC4jb2rvgVCEokYN+L/nLlmO8rfYT/gIpW2A569iJ/3b+0UEasghjuZH/ma3wIs/EQ==" data-cf-beacon='{"version":"2024.11.0","token":"7939e04a4baf43c8b86a560f74aac60e","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>
